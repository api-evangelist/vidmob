notes: >-
  Vidmob publishes a real OAuth discovery surface on the MCP hosts (mcp.vidmob.com and its authorization server
  mcp-auth.vidmob.com). The REST API host public-api.vidmob.com and the marketing site vidmob.com publish nothing under
  /.well-known/. acs.vidmob.com is a single-page app that answers 200 with an HTML shell for every /.well-known/ path —
  those responses are recorded as html-catchall and are NOT treated as discovery documents. help.vidmob.com serves a
  security.txt, but it is Intercom's own file (Canonical: https://app.intercom.com/.well-known/security.txt), not a
  Vidmob vulnerability-disclosure policy, so it is recorded here as third-party and does not feed a Security pointer.
