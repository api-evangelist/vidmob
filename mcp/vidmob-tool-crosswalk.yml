mcp_only:
  - capability: Media library search
    reason: >-
      No public REST operation searches the media library by channel, campaign, objective, ad group / ad set, DV360
      insertion order or line item, ad type, placement or impression volume. REST only offers scorecard-scoped media
      metadata and a changed-since feed.
  - capability: Creative performance
    reason: >-
      Asset-level KPI, impressions and comparison-to-average data is served by the `analytics` scope domain on MCP. The
      public REST API publishes no analytics/performance operation.
  - capability: Ad-account and channel graph
    reason: >-
      Connected channels, ad accounts, brands and markets — and their campaign/ad-group/ad hierarchy — are reachable
      only through MCP. REST stops at organization + workspaces.
