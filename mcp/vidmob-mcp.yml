authentication:
  models:
  - type: oauth2
    flow: authorization_code
    pkce: S256
    dynamic_client_registration: true
    dcr_spec: RFC 7591
    registration_endpoint: https://mcp-auth.vidmob.com/v1/oauth2/register
    authorization_endpoint: https://acs.vidmob.com/oauth/authorize
    token_endpoint: https://mcp-auth.vidmob.com/v1/oauth2/token
    issuer: https://mcp-auth.vidmob.com
    jwks_uri: https://mcp-auth.vidmob.com/.well-known/jwks.json
    audience_bound: true
    tenant_claim: organization_id
    note: 'Client ID Metadata Document (CIMD) is explicitly not supported (client_id_metadata_document_supported:
      false); Vidmob defers it to a later phase.'
  - type: apiKey
    in: header
    parameter: Authorization
    scheme: Bearer
    issued_per: organization
    management_url: https://acs.vidmob.com/api-key-management
    note: For headless/server-to-server agents that cannot complete an interactive sign-in.
  discovery:
    protected_resource: https://mcp.vidmob.com/.well-known/oauth-protected-resource
    authorization_server: https://mcp-auth.vidmob.com/.well-known/oauth-authorization-server
    openid_configuration: https://mcp-auth.vidmob.com/.well-known/openid-configuration
    challenge: 'WWW-Authenticate: Bearer resource_metadata="https://mcp.vidmob.com/.well-known/oauth-protected-resource"'
