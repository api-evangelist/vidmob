capabilities:
  source: https://help.vidmob.com/en/articles/15555021-what-does-the-vidmob-mcp-do
  status: documented
  areas:
  - name: Account and channel structure
    description: Enumerate organization structure — connected channels, ad accounts, brands, markets and
      workspaces — plus the campaigns, ad groups, ads and creatives running through them. Ad accounts
      can be narrowed to a single brand.
    scope_domain: organization
    access: read
  - name: Media library search
    description: Find creative filtered by channel, date range, campaign, objective, ad group / ad set
      (insertion order and line item for DV360), ad type, placement and impression volume (minimum or
      range, per ad or summed).
    scope_domain: scoring
    access: read
  - name: Creative scoring
    description: Submit a creative asset and receive an overall points-weighted guideline score plus a
      guideline-by-guideline breakdown of what passed, failed, or could not be evaluated.
    scope_domain: scoring
    access: read_write
  - name: Creative attributes
    description: Return the AI-detected creative attributes inside an asset — storytelling approach, messaging
      and benefit framing, production style, calls-to-action, on-screen text, logos and brands, objects,
      scenes, audio cues — with where and when each appears.
    scope_domain: scoring
    access: read
  - name: Asset detail
    description: 'Full record for a media item: file type, dimensions, aspect ratio, duration, short-lived
      signed download link, owning brand and workspace, and ad context (campaigns, ad groups, ads, live/paused
      state, delivery countries, attributed spend).'
    scope_domain: scoring
    access: read
  - name: Creative performance
    description: Asset-level performance for a channel over a date range — KPI value, impressions delivered
      and comparison to the average across the chosen scope, narrowable by campaign, ad, objective, placement
      or DV360 insertion order / line item type.
    scope_domain: analytics
    access: read
  planned:
  - name: Creative Drivers
    description: Creative driver analysis — the MCP equivalent of the platform's Element Impact report,
      returning the creative attributes most correlated with a KPI, positive and negative, drillable to
      the underlying assets.
    status: coming-next
governance:
  organization_binding: The organization is chosen by the user at authorization and stamped into the access
    token as an organization_id claim (re-stamped on refresh). Tools never accept an organization identifier
    as a parameter.
  cross_tenant: Requests for another organization's resource return HTTP 403 (Vidmob states this is verified).
  token_passthrough: false
  scope_gated_tool_visibility: true
  input_validation: Strict schema validation on every tool input; structured parameters only, no free-text
    queries.
  response_bounds: Responses are size-bounded with pagination or download-link patterns; each tool execution
    has a timeout.
  rate_limiting: rolling-out
  audit_logging: rolling-out
  hsts: planned
  source: https://help.vidmob.com/en/articles/15461399-vidmob-mcp-security-compliance-overview
