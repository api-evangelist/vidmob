deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Vidmob publishes no deprecation or sunset policy, and declares no deprecated operations in any spec. The only
    deprecation signal found anywhere in the developer surface is at the field level: the legacy per-guideline result
    value NO_DATA is described as "being phased out in favor of the specific codes below", with backwards
    compatibility explicitly preserved for integrations that match only PASS/FAIL/NO_DATA. That is a field-level
    migration note, not an API deprecation policy, so no Deprecation pointer is wired in apis.yml.
  field_level:
    - field: result
      value: NO_DATA
      status: being phased out
      replacement: NO_DATA_<CODE> specific root-cause codes
      backwards_compatible: true
      source: https://vidmob-api-docs.readme.io/docs/no_data-root-cause-codes
