apis:
- name: Vidmob MCP Server
  description: >-
    Hosted remote MCP server exposing Vidmob creative intelligence to AI agents — organization and ad-account
    structure, media-library search, creative scoring, AI-detected creative attributes, full asset detail
    and asset-level performance. Streamable HTTP and SSE transports, OAuth authorization-code + PKCE with
    dynamic client registration (RFC 7591) and audience-bound tokens carrying an organization_id claim,
    or a per-organization API key for headless agents. Works with Claude, ChatGPT, Gemini Enterprise,
    Gemini CLI and custom agents.
  humanURL: https://help.vidmob.com/en/articles/15465541-setting-up-the-vidmob-mcp-connector
  baseURL: https://mcp.vidmob.com/mcp
