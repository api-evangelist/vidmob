aid: vidmob
name: VidMob
description: >-
  Vidmob is a creative data platform that connects creative production to media performance for brands and agencies.
  Its AI analyzes the elements inside an ad creative — on-screen text, logos, objects, scenes, audio cues, storytelling
  approach, calls-to-action — and joins those detections to in-flight performance across Meta, TikTok, Google Ads,
  DV360, LinkedIn, Pinterest, Snapchat, Reddit, Amazon Advertising, The Trade Desk and Yahoo DSP. The Vidmob Public API
  exposes two programmatic capabilities on https://public-api.vidmob.com/v1 — Creative Scoring, which evaluates a media
  asset against configured brand and channel guidelines and returns a weighted score plus a per-guideline pass/fail
  breakdown, and Creative Aperture (Creative Tags), which returns structured AI-detected creative attributes for an
  asset. Both are asynchronous submit-then-poll surfaces bound to an Organization and its Workspaces. Vidmob also runs
  a hosted remote MCP server at https://mcp.vidmob.com/mcp with OAuth + PKCE, dynamic client registration and
  scope-gated tool visibility, so agents on Claude, ChatGPT, Gemini Enterprise or a customer's own framework can query
  creative inventory, scores, attributes and performance directly.
