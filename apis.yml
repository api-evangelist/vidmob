apis:
  - name: Vidmob Creative Scoring API
    description: >-
      Submit an external media asset for evaluation against the guidelines configured for a Vidmob workspace and read
      back a weighted score (0.0-1.0) and adherencePercent per advertising channel, plus a per-guideline breakdown of
      PASS / FAIL / NOT_APPLICABLE / NO_DATA_* results. Also exposes scorecard browsing, scorecard media metadata,
      criteria (guideline) metadata and a changed-since feed of media with updated scores. Asynchronous: POST the media,
      poll status every 10-15 minutes, then fetch scores.
    humanURL: https://vidmob-api-docs.readme.io/reference/getting-started-with-your-api-1
    baseURL: https://public-api.vidmob.com
    tags:
      - creative-intelligence
      - creative-analytics
      - advertising
      - media-measurement
      - video
      - computer-vision
    properties:
      - type: OpenAPI
        url: openapi/vidmob-creative-scoring-openapi.json
      - type: Documentation
        url: https://vidmob-api-docs.readme.io/docs/media-scoring-api-guide
      - type: APIReference
        url: https://vidmob-api-docs.readme.io/docs/api-reference
      - type: Overlay
        url: overlays/vidmob-creative-scoring-overlay.yaml
      - type: ErrorCatalog
        url: errors/vidmob-problem-types.yml
      - type: DataModel
        url: data-model/vidmob-data-model.yml
      - type: AgentSkill
        url: skills/_index.yml
  - name: Vidmob Creative Aperture API (Creative Tags)
    description: >-
      Submit one or more creative assets for AI-powered visual annotation and receive structured tags describing what is
      inside them — on-screen text, logos and brands, objects, scenes, audio cues, people and emotions — with where and
      when each element appears. Create a tagging job, then poll the job for status and signed download URLs for the
      resulting JSON.
    humanURL: https://vidmob-api-docs.readme.io/reference/getting-started-with-your-api
    baseURL: https://public-api.vidmob.com
    tags:
      - creative-intelligence
      - creative-data
      - computer-vision
      - video
      - advertising
    properties:
      - type: OpenAPI
        url: openapi/vidmob-creative-aperture-openapi.json
      - type: Documentation
        url: https://vidmob-api-docs.readme.io/docs/creative-tags-api-guide
      - type: Overlay
        url: overlays/vidmob-creative-aperture-overlay.yaml
  - name: Vidmob Public API (Organization & Workspaces)
    description: >-
      Account-hierarchy endpoints used to bootstrap every other Vidmob integration: retrieve the organization the API
      key is issued against, and enumerate the workspaces that key can reach along with the workspaceId values required
      by the scoring and criteria endpoints. Requires a valid API key but no specific scope.
    humanURL: https://vidmob-api-docs.readme.io/reference/organization
    baseURL: https://public-api.vidmob.com
    tags:
      - creative-data
      - account-management
      - advertising
    properties:
      - type: OpenAPI
        url: openapi/vidmob-public-api-openapi.json
      - type: Documentation
        url: https://vidmob-api-docs.readme.io/reference/organization
      - type: Overlay
        url: overlays/vidmob-public-api-overlay.yaml
  - name: Vidmob MCP Server
    description: >-
      Hosted remote MCP server exposing Vidmob creative intelligence to AI agents — organization and ad-account
      structure, media-library search, creative scoring, AI-detected creative attributes, full asset detail and
      asset-level performance. Streamable HTTP and SSE transports, OAuth authorization-code + PKCE with dynamic
      client registration (RFC 7591) and audience-bound tokens carrying an organization_id claim, or a per-organization
      API key for headless agents. Works with Claude, ChatGPT, Gemini Enterprise, Gemini CLI and custom agents.
    humanURL: https://help.vidmob.com/en/articles/15465541-setting-up-the-vidmob-mcp-connector
    baseURL: https://mcp.vidmob.com/mcp
    tags:
      - mcp
      - agent-native
      - creative-intelligence
      - creative-data
      - advertising
    properties:
      - type: MCPServer
        url: mcp/vidmob-mcp.yml
      - type: ToolCrosswalk
        url: mcp/vidmob-tool-crosswalk.yml
      - type: MCP
        url: https://mcp.vidmob.com/mcp
      - type: Documentation
        url: https://help.vidmob.com/en/articles/15555021-what-does-the-vidmob-mcp-do
      - type: OAuthScopes
        url: scopes/vidmob-scopes.yml
