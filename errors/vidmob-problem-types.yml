format: vendor
rfc9457: false
envelope:
  content_type: application/json
  note: >-
    Vidmob does not use RFC 9457 application/problem+json. It ships TWO different error envelopes and which one you get
    depends on where the request fails.
  shapes:
    - name: application-error
      used_by: 400, 404, 409 (and all business-layer failures)
      shape: |
        {
          "status": "ERROR",
          "traceId": "<string>",
          "error": {
            "identifier": "<system>.<exception-class>",
            "type": "<EXCEPTIONTYPE>",
            "system": "<originating system>",
            "message": "<human-readable message>"
          }
        }
      fields:
        status: Always "ERROR" on this envelope; the success counterpart is "OK".
        traceId: Opaque correlation id for support. The only tracing identifier Vidmob returns.
        error.identifier: Dotted identifier, e.g. vidmob.scoring.notfoundexception or vidmob.api-bff.badrequestexception.
        error.type: Uppercased exception class, e.g. BADREQUESTEXCEPTION, NOTFOUNDEXCEPTION, CONFLICTEXCEPTION.
        error.system: Originating internal system, e.g. scoring, api-bff.
        error.message: Human-readable detail; not a stable machine key.
    - name: gateway-auth-error
      used_by: 401
      shape: |
        {
          "statusCode": 401,
          "message": "Request is Unauthorized",
          "error": "Unauthorized"
        }
      note: >-
        The 401 envelope is a different shape entirely — a flat statusCode/message/error object with no status, no
        traceId and no error.identifier. Clients must branch on the presence of `error.identifier` versus `statusCode`
        rather than assuming one envelope.
