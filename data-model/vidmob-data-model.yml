note: >-
  The three published specs declare NO components.schemas — every request and response body is inline, and the 200
  responses carry examples rather than named models. The entity graph below is therefore derived from path structure,
  path/query parameter names, request bodies and the account hierarchy Vidmob documents, not from $ref links.
  Relationships marked confidence: low are implied by the documentation rather than by a spec reference.
entities:
  - name: Organization
    description: Top-level tenant. An API key is issued at organization level and grants access to all its workspaces.
    id_field: id
    operations: [get-organization]
    path: /v1/organization
  - name: Workspace
    description: >-
      Subdivision of an organization, scoped by brand, region or team. Owns scorecards, guidelines and media, and its
      workspaceId is the required scoping parameter for most scoring reads.
    id_field: workspaceId
    id_format: integer
    operations: [get-organization-copy, get-workspace-scorecards]
    path: /v1/workspaces
  - name: Scorecard
    description: >-
      Named collection of guidelines configured for a workspace. Typed as preflight, inflight or ad_account — date
      filters apply only to inflight scorecards.
    id_field: scorecardId
    operations: [get-workspace-scorecards, 'get_v1scoringworkspace{workspaceId}scorecards-1']
    path: /v1/scoring/workspace/{workspaceId}/scorecards
  - name: Criteria
    description: >-
      Individual scoring guideline (rule) evaluated against an asset, with a weight and a channel. Can be scoped
      org-wide or workspace-specific, and is returned grouped.
    operations: [get-criteria-metadata]
    path: /v1/scoring/criteria/metadata
  - name: Media
    description: >-
      A creative asset registered with Vidmob. Identified permanently by a Vidmob-issued uniqueId (UUID), and
      addressable by the caller's own id when accompanied by source and version.
    id_field: uniqueId
    id_format: uuid
    alternate_key: [id, version, source]
    operations: [upload-media-for-scoring, get-media-scoring-status, 'get_v1scoringworkspace{workspaceId}scorecards-1',
      get_v1mediaupdated-scores]
    path: /v1/media
  - name: Score
    description: >-
      Per-channel scoring result for one media asset — a weighted score and adherencePercent (both 0.0-1.0) plus
      pass/fail counts, and in detail format a per-guideline breakdown of result, name, rule and weight.
    operations: [get-media-score]
    path: /v1/scoring/media/{mediaId}/scores
  - name: Channel
    description: >-
      Advertising platform a guideline or score applies to. A closed enumeration with input aliases; see
      conventions/vidmob-conventions.yml.
    id_format: enum
  - name: ApertureJob
    description: >-
      Creative Tags annotation job over one or more creatives. Returns a jobId, a status, and on completion signed
      download URLs for the tag JSON.
    id_field: jobId
    id_format: uuid
    operations: [create-creative-aperture-job, get-creative-aperture-job-status]
    path: /v1/media/aperture
  - name: Creative
    description: >-
      Asset submitted inside an Aperture job, carrying a caller-supplied id, a url, and optional clientTags used to
      carry the caller's own metadata through the job.
    id_field: id
    parent: ApertureJob
